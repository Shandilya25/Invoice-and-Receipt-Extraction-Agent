# Tool configuration only. Dependencies live in requirements*.txt (simpler for Docker/CI).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data/raw"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
